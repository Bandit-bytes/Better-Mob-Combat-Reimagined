name: Feature request
description: Suggest a new animation, mob support, config option, or mod compatibility.
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: How would it make mob combat better?
  - type: dropdown
    id: version
    attributes:
      label: Minecraft version & loader you play on
      multiple: true
      options:
        - "1.21.1 NeoForge"
        - "1.20.1 Forge"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Videos, references, or related mods.
